name: Release & GHCR Publish

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract Tag Version
        id: meta
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Train model artifact for release
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          export MODEL_VERSION=${{ steps.meta.outputs.VERSION }}
          python src/train.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}

      - name: Container Integration Smoke Tests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}"
          docker run -d --name smoke-container -p 80:80 -e MODEL_VERSION=${{ steps.meta.outputs.VERSION }} $IMAGE
          sleep 5

          # 1. Health check
          curl -f http://localhost:80/health

          # 2. Predict valid payload
          curl -f -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 0.02, "sex": -0.044, "bmi": 0.06, "bp": -0.03, "s1": -0.02, "s2": 0.03, "s3": -0.02, "s4": 0.02, "s5": 0.02, "s6": -0.001}'

          # 3. Missing s6 field check (must yield HTTP 422)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 0.02, "sex": -0.044, "bmi": 0.06, "bp": -0.03, "s1": -0.02, "s2": 0.03, "s3": -0.02, "s4": 0.02, "s5": 0.02}')
          if [ "$STATUS" -ne 422 ]; then
            echo "Expected status 422, received $STATUS"
            exit 1
          fi

          docker stop smoke-container && docker rm smoke-container

      - name: Push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            models/metrics.json
            models/model.bin